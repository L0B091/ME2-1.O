services:
  - type: web
    name: me2-backend
    runtime: node
    plan: free
    region: oregon
    branch: me2_dlp
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.2
      - key: NODE_ENV
        value: development
      - key: TRUST_PROXY
        value: "1"
